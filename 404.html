<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страница не найдена | Nexora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="img/nexora-icon.svg">
    <link rel="stylesheet" href="css/style.css?v=2">
    <style>
        .error-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:40px 20px}
        .error-code{font-family:var(--font-heading);font-size:clamp(80px,15vw,160px);font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:16px}
        .error-title{font-size:22px;font-weight:600;color:var(--text);margin-bottom:8px}
        .error-desc{font-size:15px;color:var(--text-secondary);margin-bottom:32px;max-width:400px}
        .error-link{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;background:var(--accent);color:#000;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:1px;border-radius:var(--radius);text-decoration:none;transition:all var(--transition)}
        .error-link:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,255,255,.15)}
    </style>
</head>
<body>
    <main class="error-page">
        <div class="error-code">404</div>
        <h1 class="error-title">Страница не найдена</h1>
        <p class="error-desc">Похоже, этой страницы больше нет. Может, ссылка устарела или вы опечатались.</p>
        <a href="index.html" class="error-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
            На главную
        </a>
    </main>
</body>
</html>
